</head><body class="bg-background font-body-md text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin-mobile flex items-center gap-md"><button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-on-surface">arrow_back</span></button><span class="font-headline-md text-headline-md text-on-surface truncate">Lapor Sampah</span></div></header><main class="relative pt-16 bg-background min-h-screen"><div class="flex flex-col w-full h-full relative" id="report-flow-container">
<!-- Map Background -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center" data-location="Samarinda, Indonesia" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAzWgboOTyVsRifv7jlL_udmmJwabxVSHO6TNGj1_PGdR6m6BhcO9D-AC0rjAIgZdcQVuc86um1NGTDsPeXno-xeKVoHhrvOj1wH9Ch2qC9xcHji3uOnoN4v3tsaRFXW632tyOWo1TqWma4_ZNW9MPKdE7cVzx4oIwXNnMIZ-N8cTIVm_XwPTT4PyUH-SzyBwYlqCC-n6GqosbBWlacZAm52CoOLxCtbyHrlrjm0tbZmQ_OEF1XlX0g')"></div>
<div class="absolute inset-0 bg-background/20 backdrop-blur-sm transition-opacity duration-300" id="map-overlay"></div>
</div>
<!-- Map Markers (Fake) -->
<div class="absolute top-[20%] left-[30%] z-10 w-12 h-12">
<div class="relative w-full h-full flex items-center justify-center">
<div class="absolute w-8 h-8 rounded-full bg-primary/20 animate-ping"></div>
<div class="w-4 h-4 rounded-full bg-primary border-[2px] border-surface"></div>
</div>
</div>
<!-- Bottom Sheet -->
<div class="mt-auto relative z-20 w-full rounded-t-[32px] bg-surface shadow-[0_-8px_32px_rgba(0,0,0,0.12)] transition-transform duration-500 ease-out transform translate-y-0 flex flex-col" id="bottom-sheet" style="min-height: 85vh;">
<!-- Drag Handle -->
<div class="w-full flex justify-center py-sm cursor-grab active:cursor-grabbing" id="drag-handle">
<div class="w-12 h-1 bg-outline-variant rounded-full"></div>
</div>
<div class="px-margin-mobile pb-xl flex flex-col flex-1 overflow-y-auto" id="step-container">
<!-- Header -->
<div class="flex justify-between items-center mb-lg">
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Lapor Masalah</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Bantu jaga kebersihan kota kita.</p>
</div>
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
</div>
<!-- Form Content -->
<div class="space-y-lg flex-1">
<!-- Step 1: Location -->
<div class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-surface-container">
<div class="flex items-center gap-sm mb-sm">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-label-md text-label-md text-on-surface">Lokasi Saat Ini</span>
</div>
<div class="flex items-center justify-between">
<div>
<p class="font-body-md text-body-md text-on-surface font-medium truncate">Jl. Kesuma Bangsa No. 24</p>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-xs">-0.49382, 117.14672</p>
</div>
<button class="px-md py-sm rounded-lg bg-secondary-container text-on-secondary-container font-label-md text-label-md hover:bg-secondary-fixed transition-colors">
                            Ubah
                        </button>
</div>
</div>
<!-- Step 2: Image -->
<div>
<label class="font-label-md text-label-md text-on-surface mb-sm block">Foto Bukti</label>
<div class="w-full aspect-[4/3] bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container border-dashed border-2 flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container-low transition-colors relative overflow-hidden group" id="photo-upload">
<div class="w-14 h-14 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container mb-sm group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-medium">Ambil Foto atau Pilih</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-xs">Maks. 5MB (JPG/PNG)</span>
<input accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file"/>
</div>
</div>
<!-- Step 3: Category -->
<div>
<label class="font-label-md text-label-md text-on-surface mb-sm block">Kategori Laporan</label>
<div class="grid grid-cols-2 gap-sm">
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="category" type="radio" value="tumpukan"/>
<div class="p-md rounded-xl bg-surface-container-lowest border border-surface-container shadow-sm peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all text-center flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-[24px]">delete</span>
<span class="font-label-md text-label-md font-medium">Tumpukan Liar</span>
</div>
<div class="absolute inset-0 rounded-xl ring-2 ring-primary opacity-0 peer-checked:opacity-100 peer-focus-visible:opacity-100 transition-opacity pointer-events-none blur-[2px]"></div>
</label>
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="category" type="radio" value="overload"/>
<div class="p-md rounded-xl bg-surface-container-lowest border border-surface-container shadow-sm peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all text-center flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-[24px]">markdown</span>
<span class="font-label-md text-label-md font-medium">TPS Overload</span>
</div>
<div class="absolute inset-0 rounded-xl ring-2 ring-primary opacity-0 peer-checked:opacity-100 peer-focus-visible:opacity-100 transition-opacity pointer-events-none blur-[2px]"></div>
</label>
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="category" type="radio" value="plastik"/>
<div class="p-md rounded-xl bg-surface-container-lowest border border-surface-container shadow-sm peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all text-center flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-[24px]">recycling</span>
<span class="font-label-md text-label-md font-medium">Plastik/Anorganik</span>
</div>
<div class="absolute inset-0 rounded-xl ring-2 ring-primary opacity-0 peer-checked:opacity-100 peer-focus-visible:opacity-100 transition-opacity pointer-events-none blur-[2px]"></div>
</label>
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="category" type="radio" value="organik"/>
<div class="p-md rounded-xl bg-surface-container-lowest border border-surface-container shadow-sm peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all text-center flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-[24px]">compost</span>
<span class="font-label-md text-label-md font-medium">Limbah Organik</span>
</div>
<div class="absolute inset-0 rounded-xl ring-2 ring-primary opacity-0 peer-checked:opacity-100 peer-focus-visible:opacity-100 transition-opacity pointer-events-none blur-[2px]"></div>
</label>
</div>
</div>
<!-- Step 4: Notes -->
<div>
<label class="font-label-md text-label-md text-on-surface mb-sm block" for="notes">Catatan Tambahan (Opsional)</label>
<div class="relative">
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-md font-body-md text-body-md text-on-surface placeholder-on-surface-variant/60 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-none shadow-sm" id="notes" placeholder="Contoh: Sudah menumpuk sejak 3 hari yang lalu, bau menyengat." rows="3"></textarea>
<div class="absolute inset-0 rounded-xl ring-2 ring-primary opacity-0 pointer-events-none blur-[2px] transition-opacity peer-focus:opacity-100"></div>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="mt-lg pt-sm pb-safe">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-label-md text-label-md font-bold flex items-center justify-center gap-sm shadow-md hover:bg-primary-fixed-variant hover:shadow-lg transition-all active:scale-[0.98]" id="submit-btn">
<span>Kirim Laporan</span>
<span class="material-symbols-outlined text-[20px]">send</span>
</button>
</div>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const fileInput = document.querySelector('#photo-upload input');
        const photoUploadArea = document.getElementById('photo-upload');
        const submitBtn = document.getElementById('submit-btn');

        // Simple file input visual feedback
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                photoUploadArea.classList.add('bg-primary-container');
                photoUploadArea.classList.add('text-on-primary-container');
                photoUploadArea.querySelector('span:nth-of-type(1)').textContent = 'Foto Terpilih';
                photoUploadArea.querySelector('.material-symbols-outlined').textContent = 'check_circle';
            }
        });

        // Submit button interaction
        submitBtn.addEventListener('click', () => {
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Mengirim...</span>';
            submitBtn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Laporan Terkirim!</span>';
                submitBtn.classList.replace('bg-primary', 'bg-primary-fixed');
                submitBtn.classList.replace('text-on-primary', 'text-on-primary-fixed');
                
                setTimeout(() => {
                    // Reset or close sheet in real app
                }, 2000);
            }, 1500);
        });

        // Basic bottom sheet drag physics simulation
        let startY;
        let currentY = 0;
        const sheet = document.getElementById('bottom-sheet');
        const handle = document.getElementById('drag-handle');

        handle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY - currentY;
            sheet.style.transition = 'none';
        });

        handle.addEventListener('touchmove', (e) => {
            const y = e.touches[0].clientY - startY;
            if (y > 0) { // Only allow dragging down
                currentY = y;
                sheet.style.transform = `translateY(${y}px)`;
            }
        });

        handle.addEventListener('touchend', () => {
            sheet.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
            if (currentY > window.innerHeight * 0.2) {
                // If dragged down enough, "close" it (just hide mostly for demo)
                sheet.style.transform = `translateY(calc(100% - 64px))`;
            } else {
                // Snap back to top
                currentY = 0;
                sheet.style.transform = `translateY(0)`;
            }
        });
    });
</script></main></body></html>
